#    helm install ingress-nginx ingress-nginx/ingress-nginx \
#      --namespace ingress-nginx \
#      --create-namespace \
#      --set controller.service.annotations."service\.beta\.kubernetes\.io/azure-load-balancer-health-probe-request-path"=/healthz
# - Apply helm to create the Ingress
# - Create a DNS NAME record pointing at the external IP of the Ingress
# - Create an SSL certificate for the host name
# - Create a TLS Secret from the SSL certificate files, for instance:
#     kubectl create secret tls tls-secret-cast --cert=path/to/tls.crt --key=path/to/tls.key -n castimaging-v3
