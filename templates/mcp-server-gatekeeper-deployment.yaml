{{- if .Values.McpServerGatekeeper.enable }}
{{- $mcpGkEnv := .Values.MCPSERVERGATEKEEPER | default dict }}
# CAST Gatekeeper MCP Server: exposes the CAST Dashboard compliance data through MCP.
# Registers in the Control Panel (Eureka) as GatekeeperMCPServer on mcp-server-gatekeeper:8283;
# the Dashboard API settings are retrieved from the Control Panel configuration.
kind: Service
apiVersion: v1
metadata:
  name: mcp-server-gatekeeper
  labels:
    app: castimaging
    imaging.group: console
    imaging.service: mcp-server-gatekeeper
  namespace: {{ .Release.Namespace }}
spec:
  ports:
  - name: http
    port: 8283
    targetPort: 8283
  selector:
    imaging.service: mcp-server-gatekeeper
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: castimaging
    imaging.group: console
    imaging.service: mcp-server-gatekeeper
    version: {{ .Values.McpServerGatekeeperImage.tag | default .Values.version | quote }}
  name: mcp-server-gatekeeper
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.McpServerGatekeeperReplicaCount }}
  selector:
    matchLabels:
      imaging.service: mcp-server-gatekeeper
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: "false"
      labels:
        console.network/aip-network: "true"
        app: castimaging
        imaging.group: console
        imaging.service: mcp-server-gatekeeper
    spec:
  {{- if .Values.EnforceNodeAffinity }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            {{- toYaml .Values.nodeSelectorAppcastimaging | nindent 12 }}
        podAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            {{- toYaml .Values.podAffinityGroupConsole | nindent 12 }}
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            {{- toYaml .Values.labelSelectorGroupViewer | nindent 12 }}
  {{- end }}
  {{- if .Values.EnforceBalancedAffinity }}
      affinity:
        podAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            {{- toYaml .Values.podAffinityGroupConsole | nindent 12 }}
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            {{- toYaml .Values.podAffinityGroupViewer | nindent 12 }}
  {{- end }}
      # No Kubernetes service env vars: the mcp-server Service would inject MCP_SERVER_PORT=tcp://<ip>:8285,
      # which collides with the MCP_SERVER_PORT setting of the gatekeeper
      enableServiceLinks: false
      # Image user is "gatekeeper" (1000:1000)
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
  {{- if .Values.RestrictedSecurityMode }}
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
  {{- end }}
      initContainers:
        - name: control-panel-healthcheck
          image: {{ .Values.InitUtilImage.name }}:{{ .Values.InitUtilImage.tag }}
          imagePullPolicy: "{{ .Values.InitUtilImage.pullPolicy }}"
          command:
          - /bin/sh
          - -c
          - |
            until curl -s --fail --max-time 5 http://console-control-panel:8098/actuator/health | grep -q '"status":"UP"'; do
              echo "Waiting for console-control-panel to be healthy..."
              sleep 2
            done
            echo "console-control-panel is healthy!"
  {{- if .Values.RestrictedSecurityMode }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
  {{- end }}
          resources:
            {{- toYaml .Values.InitContainerResources | nindent 12 }}
      containers:
        # Default image command (/app/init.sh): loads /app/server/config/app.config (embedded in the image),
        # waits for the Control Panel, then starts the server. Environment variables override app.config.
        - env:
{{- range $key, $value := $mcpGkEnv }}
            - name: {{ $key }}
              value: {{ $value | quote }}
{{- end }}
            # Control Panel: configuration (Dashboard API, Keycloak) and service registration
            - name: HOST_CONTROL_PANEL
              value: "console-control-panel"
            - name: PORT_CONTROL_PANEL
              value: "8098"
            - name: CONTROL_PANEL_SSL_ENABLED
              value: "false"
            - name: SERVICE_NAME
              value: "GatekeeperMCPServer"
            - name: SERVICE_HOST
              value: "mcp-server-gatekeeper"
            - name: MCP_SERVER_PORT
              value: "8283"
            # Logs and telemetry on the logs volume
            - name: MCP_LOG_FILE
              value: "/app/logs/mcp_gatekeeper.log"
            - name: TELEMETRY_LOCAL_FILE
              value: "/app/logs/telemetry/telemetry.jsonl"
          image: "{{ .Values.McpServerGatekeeperImage.name }}:{{ .Values.McpServerGatekeeperImage.tag }}"
          imagePullPolicy: "{{ .Values.McpServerGatekeeperImage.pullPolicy }}"
          name: mcp-server-gatekeeper
          startupProbe:
            httpGet:
              path: /mcp/healthcheck
              port: 8283
              scheme: HTTP
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /mcp/healthcheck
              port: 8283
              scheme: HTTP
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
            successThreshold: 1
          ports:
            - containerPort: 8283
              protocol: TCP
  {{- if .Values.RestrictedSecurityMode }}
          securityContext:
            readOnlyRootFilesystem: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
  {{- end }}
          resources:
            {{- toYaml .Values.McpServerGatekeeperResources | nindent 12 }}
          volumeMounts:
  {{- if .Values.RestrictedSecurityMode }}
            - name: tmp
              mountPath: /tmp
  {{- end }}
            - name: logdir
              mountPath: /app/logs
              readOnly: false
  {{- if .Values.ServiceAccountName }}
      serviceAccountName: {{ .Values.ServiceAccountName }}
  {{- end }}
  {{- if .Values.UseImagePullSecrets }}
      imagePullSecrets:
        - name: imagepull-sec
  {{- end }}
      volumes:
  {{- if .Values.RestrictedSecurityMode }}
        - name: tmp
          emptyDir: {}
  {{- end }}
        - name: logdir
          persistentVolumeClaim:
            claimName: pvc-mcpservergatekeeper-logs
{{- end }}
