apiVersion: v1
kind: Service
metadata:
  name: viewer-neo4j
  labels:
    app: castimaging
    imaging.group: viewer
    imaging.service: viewer-neo4j
  namespace: {{ .Release.Namespace }}
spec:
  ports:
    - port: 7474
      targetPort: 7474
      name: browser
{{- if .Values.neo4jBrowserNodePort }} 
      nodePort: {{ .Values.neo4jBrowserNodePort }}
{{- end }}
    - port: 7687
      targetPort: 7687
      name: bolt
{{- if .Values.neo4jBoltNodePort }} 
      nodePort: {{ .Values.neo4jBoltNodePort }}
{{- end }}
    - port: 7473
      targetPort: 7473
      name: https
    - port: 8888
      targetPort: 8888
      name: upgrade
{{- if or .Values.neo4jBrowserNodePort .Values.neo4jBoltNodePort .Values.allNodePort }}
  type: NodePort
{{- end }}
  selector:
    imaging.service: viewer-neo4j
---
apiVersion: "apps/v1"
kind: StatefulSet
metadata:
  labels:
    app: castimaging
    imaging.group: viewer
    imaging.service: viewer-neo4j  
  name: viewer-neo4j-core
  namespace: {{.Release.Namespace}}
spec:
  serviceName: viewer-neo4j
  replicas: {{.Values.ViewerNeo4jReplicaCount}}
  selector:
    matchLabels:
      imaging.service: viewer-neo4j
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: "false"
      labels:
        app: castimaging
        imaging.group: viewer
        imaging.service: viewer-neo4j
    spec:
{{- if .Values.EnforceNodeAffinity }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            {{- toYaml .Values.nodeSelectorAppcastimaging | nindent 12 }}
        podAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            {{- toYaml .Values.podAffinityGroupViewer | nindent 12 }}
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            {{- toYaml .Values.labelSelectorServicePostgresAnalysisNode | nindent 12 }}
            {{- toYaml .Values.labelSelectorGroupConsole | nindent 12 }}
{{- end }}
{{- if .Values.EnforceBalancedAffinity }}
      affinity:
        podAntiAffinity:
    {{- if .Values.BalancedAffinity.EnforceNeo4jIsolation }}
          requiredDuringSchedulingIgnoredDuringExecution:
            {{- toYaml .Values.labelSelectorAppcastimaging | nindent 12 }}
    {{- else }}
          requiredDuringSchedulingIgnoredDuringExecution:
            {{- toYaml .Values.labelSelectorServiceAnalysisNode | nindent 12 }}
          preferredDuringSchedulingIgnoredDuringExecution:
            {{- toYaml .Values.podAffinityGroupConsole | nindent 12 }}
    {{- end }}  
{{- end }}
      securityContext:
        fsGroup: 7474
        fsGroupChangePolicy: OnRootMismatch
{{- if .Values.RestrictedSecurityMode }}
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
{{- end }}
{{- if .Values.RestrictedSecurityMode }}
      initContainers:      
        - name: init-folders
          image: "{{.Values.ViewerNeo4jImage.name}}:{{.Values.ViewerNeo4jImage.tag}}"
          imagePullPolicy: "{{.Values.ViewerNeo4jImage.pullPolicy}}"
          command:
          - /bin/bash
          - -c
          - |
            rm -rf /neo4j-var-volume/* || true
            cd /var && find . -mindepth 1 -maxdepth 1 ! -name empty -exec cp -a {} /neo4j-var-volume/ \; 2>/dev/null || true
          volumeMounts:
            - name: neo4j-var-dir
              mountPath: /neo4j-var-volume
          securityContext:
            readOnlyRootFilesystem: true
            runAsUser: 7474
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            {{- toYaml .Values.InitContainerResources | nindent 12 }}
{{- end }}
      containers:
        - name: viewer-neo4j
          image: "{{.Values.ViewerNeo4jImage.name}}:{{.Values.ViewerNeo4jImage.tag}}"
          imagePullPolicy: "{{.Values.ViewerNeo4jImage.pullPolicy}}"
          command: ['sh', '-c', "/var/lib/neo4j/config/init.sh"]
          env:
{{- $neo4jReserved := list "NEO4J_ACCEPT_LICENSE_AGREEMENT" "NEO4J_USERNAME" "NEO4J_PASSWORD" "NEO4J_BOLT_ENDPOINT" }}
{{- $neo4jFlat := dict }}
{{- range $key, $value := .Values }}
{{- if and (hasPrefix "NEO4J_" $key) (not (has $key $neo4jReserved)) }}
{{- $_ := set $neo4jFlat $key $value }}
{{- end }}
{{- end }}
{{- $neo4jVars := merge $neo4jFlat (.Values.NEO4J | default dict) }}
{{- range $key, $value := $neo4jVars }}
            - name: {{ $key }}
              value: {{ $value | quote }}
{{- end }}
            - name: NEO4J_ACCEPT_LICENSE_AGREEMENT
              value: "yes"
            - name: TZ
              value: "UTC"
            - name: NEO4J_USERNAME
              value: "neo4j"
            - name: NEO4J_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret | default "imaging-pwd-sec" }}
                  key: neo4j-password
            - name: LOG_LEVEL
              value: "debug"
            - name: PODMAN_ENV
              value: "false"
            - name: NEO4J_BOLT_ENDPOINT
              value: "bolt://viewer-neo4j:7687"
{{- if .Values.ContextUrl.enable }}
            - name: APP_CONTEXT
              value: {{ .Values.ContextUrl.appcontext }}
{{- end }}
          startupProbe:
            httpGet:
              path: /
              port: 7474
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 30
            failureThreshold: 60
          ports:
            - containerPort: 7474
              name: browser
            - containerPort: 7687
              name: bolt
            - containerPort: 7473
              name: https
            - containerPort: 8888
              name: upgrade
{{- if .Values.RestrictedSecurityMode }}
          securityContext:
            readOnlyRootFilesystem: true
            runAsUser: 7474
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
{{- end }}
          resources:
            {{- toYaml .Values.ViewerNeo4jResources | nindent 12 }}
          volumeMounts:
{{- if .Values.RestrictedSecurityMode }}
            - name: neo4j-var-dir
              mountPath: /var
            - name: tmp
              mountPath: /tmp
{{- end }}
            - name: neo4jdata
              mountPath: /var/lib/neo4j/logs
              subPath: logs
            - name: neo4jdata
              mountPath: /var/lib/neo4j/config/neo4j5_data
              subPath: neo4jdata
            - name: neo4jdata
              mountPath: /var/lib/neo4j/config/csv/archive
              subPath: csvarchive                    
{{- if .Values.UseImagePullSecrets }}              
      imagePullSecrets:
        - name: imagepull-sec
{{- end }}        
      volumes:
{{- if .Values.RestrictedSecurityMode }}
        - name: neo4j-var-dir
          emptyDir: {}
        - name: tmp
          emptyDir: {}
{{- end }}
  volumeClaimTemplates:
    - metadata:
        name: neo4jdata
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: "{{ .Values.DiskClassName }}"
        resources:
          requests:
            storage: "{{ .Values.size_neo4jdata }}"
