{{- if .Values.CastStorageService.enable }}
apiVersion: v1
kind: Service
metadata:
{{- if .Values.CreatePostgresLoadBalancer }}
  annotations:
    helm.sh/resource-policy: keep
{{- if .Values.UseInternalLoadBalancer }}
  {{- if eq .Values.K8SProvider "AKS" }}
    service.beta.kubernetes.io/azure-load-balancer-internal: "true"
  {{- else if eq .Values.K8SProvider "EKS" }}
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internal"
  {{- else if eq .Values.K8SProvider "GKE" }}
    networking.gke.io/load-balancer-type: "Internal"
  {{- end }}
{{- end }}
{{- end }}
  labels:
    app: castimaging
    imaging.service: console-postgres
  name: console-postgres
  namespace: {{ .Release.Namespace }}
spec:
  ports:
    - name: "2285"
      port: 2285
      targetPort: 5432
{{- if .Values.postgresNodePort }}
      nodePort: {{ .Values.postgresNodePort }}
{{- end }}
{{- if .Values.CreatePostgresLoadBalancer }}
  type: LoadBalancer
{{- else if or .Values.postgresNodePort .Values.allNodePort }}
  type: NodePort
{{- end }}
  selector:
    imaging.service: console-postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app: castimaging
    imaging.service: console-postgres
  name: console-postgres
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.ConsolePostgresReplicaCount }}
  serviceName: console-postgres
  selector:
    matchLabels:
      imaging.service: console-postgres
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: "false"
      labels:
        console.network/aip-network: "true"
        app: castimaging
        imaging.service: console-postgres
    spec:
      terminationGracePeriodSeconds: 120
  {{- if .Values.EnforceNodeAffinity }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            {{- toYaml .Values.nodeSelectorAppcastimaging | nindent 12 }}
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            {{- toYaml .Values.labelSelectorAppcastimaging | nindent 12 }}
  {{- end }}
  {{- if .Values.EnforceBalancedAffinity }}
      affinity:
        podAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            {{- toYaml .Values.podAffinityGroupConsole | nindent 12 }}
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            {{- toYaml .Values.podAffinityGroupViewer | nindent 12 }}
    {{- if .Values.BalancedAffinity.EnforcePostgresIsolation }}
          requiredDuringSchedulingIgnoredDuringExecution:
            {{- toYaml .Values.labelSelectorAppcastimaging | nindent 12 }}
    {{- end }}
  {{- end }}
  {{- if .Values.RestrictedSecurityMode }}
      securityContext:
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
  {{- end }}
  {{- if .Values.CastStorageService.ssl }}
      initContainers:
        - name: generate-ssl-cert
          image: "{{ .Values.ConsolePostgresImage.name }}:{{ .Values.ConsolePostgresImage.tag }}"
          imagePullPolicy: "{{ .Values.ConsolePostgresImage.pullPolicy }}"
          command:
            - bash
            - -c
            - |
              set -euo pipefail
              echo "[generate-ssl-cert] Generating private key..."
              umask 177
              openssl genrsa -out /var/lib/postgresql/ssl/server.key 2048
              echo "[generate-ssl-cert] Generating self-signed certificate..."
              umask 133
              openssl req -new -x509 -days 3650 -nodes \
                -key /var/lib/postgresql/ssl/server.key \
                -subj "/CN=console-postgres" \
                -out /var/lib/postgresql/ssl/server.crt
              echo "[generate-ssl-cert] SSL certificate generated successfully"
          volumeMounts:
            - name: postgres-ssl
              mountPath: /var/lib/postgresql/ssl
          securityContext:
            runAsUser: 999          # postgres uid — files are owned correctly at creation
            runAsGroup: 999
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
    {{- if .Values.RestrictedSecurityMode }}
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
    {{- end }}
          resources:
            {{- toYaml .Values.InitContainerResources | nindent 12 }}
  {{- end }}
      containers:
        - env:
  {{- if .Values.RestrictedSecurityMode }}
            - name: PGDATA
              value: {{ .Values.postgresqlDataMountPath }}/pgdata
  {{- end }}
            - name: POSTGRES_INITDB_ARGS
              value: -E 'UTF-8' --lc-collate=C --lc-ctype=C
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret | default "imaging-pwd-sec" }}
                  key: postgres-db-password
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_DB
              value: postgres
          image: "{{ .Values.ConsolePostgresImage.name }}:{{ .Values.ConsolePostgresImage.tag}}"
  {{- if .Values.CastStorageService.ssl }}
          args:
            - "-c"
            - "ssl=on"
            - "-c"
            - "ssl_cert_file=/var/lib/postgresql/ssl/server.crt"
            - "-c"
            - "ssl_key_file=/var/lib/postgresql/ssl/server.key"
            - "-c"
            - "ssl_min_protocol_version=TLSv1.2"
            - "-c"
            - "hba_file=/etc/postgresql/pg_hba.conf"
  {{- end }}
          imagePullPolicy: "{{ .Values.ConsolePostgresImage.pullPolicy }}"
          name: console-postgres
          startupProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 20
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 20
            successThreshold: 1
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 20
            successThreshold: 1
          ports:
            - containerPort: 5432
              protocol: TCP
  {{- if .Values.RestrictedSecurityMode }}
          securityContext:
            readOnlyRootFilesystem: true
            runAsUser: 999
            runAsGroup: 999
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
  {{- end }}
          resources:
            {{- toYaml .Values.ConsolePostgresResources | nindent 12 }}
          volumeMounts:
            - mountPath: {{ .Values.postgresqlDataMountPath }}
              name: db-data
              subPath: postgres
            - name: pgconf
              mountPath: "/usr/share/postgresql/postgresql.conf.sample"
              subPath: postgresql.conf.sample
            - name: pginit
              mountPath: "/docker-entrypoint-initdb.d/init-db.sh"
              subPath: init-db.sh
            - name: dshm
              mountPath: /dev/shm
            - name: db-creds
              mountPath: /opt/secrets
              readOnly: true
  {{- if .Values.CastStorageService.ssl }}
            - name: postgres-ssl
              mountPath: /var/lib/postgresql/ssl
              readOnly: true
            - name: pghbaconf
              mountPath: /etc/postgresql/pg_hba.conf
              subPath: pg_hba.conf
              readOnly: true
  {{- end }}
  {{- if .Values.RestrictedSecurityMode }}
            - name: tmp
              mountPath: /tmp
            - name: run
              mountPath: /var/run
  {{- end }}
      volumes:
        - name: db-data
          persistentVolumeClaim:
            claimName: db-data
        - name: pgconf
          configMap:
            name: console-v3-postgresqlconf
        - name: pginit
          configMap:
            name: console-v3-init-db
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.postgres_shmsize }}
        - name: db-creds
          secret:
            secretName: {{ .Values.existingSecret | default "imaging-pwd-sec" }}
  {{- if .Values.CastStorageService.ssl }}
        - name: postgres-ssl
          emptyDir: {}
        - name: pghbaconf
          configMap:
            name: console-v3-pghbaconf
  {{- end }}
  {{- if .Values.RestrictedSecurityMode }}
        - name: tmp
          emptyDir: {}
        - name: run
          emptyDir: {}
  {{- end }}
{{- end }}
---
{{- if .Values.CustomPostgres.enable }}
apiVersion: batch/v1
kind: Job
metadata:
  name: custom-postgres-init-job
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-options: Replace=true
spec:
  backoffLimit: 0
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
  {{- if .Values.EnforceNodeAffinity }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            {{- toYaml .Values.nodeSelectorAppcastimaging | nindent 12 }}
  {{- end }}
  {{- if .Values.RestrictedSecurityMode }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
  {{- end }}
      restartPolicy: Never
      containers:
        - name: postgres-init
          image: "{{ .Values.InitUtilImage.name }}:{{ .Values.InitUtilImage.tag}}"
          env:
            - name: PGHOST
              value: "{{ .Values.CustomPostgres.host }}"
            - name: PGPORT
              value: "{{ .Values.CustomPostgres.port }}"             
            - name: POSTGRES_USER
              value: "{{ .Values.CustomPostgres.adminlogin }}" 
            - name: POSTGRES_DB
              value: postgres

          command: ["/bin/bash", "-c", "/tmp/init-db-custom-pg.sh"]
          volumeMounts:
            - name: init-db-custom-pg
              mountPath: "/tmp/init-db-custom-pg.sh"               
              subPath: init-db-custom-pg.sh
            - name: db-creds
              mountPath: /opt/secrets
              readOnly: true 
  {{- if .Values.RestrictedSecurityMode }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
  {{- end }}
          resources:
            {{- toYaml .Values.InitContainerResources | nindent 12 }}
      volumes:
        - name: init-db-custom-pg
          configMap:
            name: init-db-custom-pg
            defaultMode: 0775
        - name: db-creds
          secret:
            secretName: {{ .Values.existingSecret | default "imaging-pwd-sec" }}
{{- end }}