{{- if .Values.UseCookieAdapter }}
# The cookie-adapter is only needed when SAML authentication is enabled in combination with UseIstioGateway or CreateIngress
apiVersion: v1
kind: ConfigMap
metadata:
  name: cookie-adapter-config
  namespace: {{ .Release.Namespace }}
data:
  default.conf: |
    # CRITICAL: Define upstream with connection pooling
    upstream console_gateway {
        server console-gateway-service:8090 max_fails=3 fail_timeout=30s;
        
        # CRITICAL: Enable keepalive connection pool
        keepalive 32;
        keepalive_timeout 300s;
        keepalive_requests 1000;
    }
    
    server {
        listen 8080;
        server_name _;
        
        # CRITICAL: Connection timeout settings
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        
        # CRITICAL: Keepalive settings
        keepalive_timeout 300s;
        keepalive_requests 1000;

        location = /healthz {
            access_log off;
            return 200 'OK';
        }
    {{- if .Values.ContextUrl.enable }}
        # Match /mycontext/auth and everything under it
        location {{ .Values.ContextUrl.appcontext }}/auth {
            # Rewrite to remove the context path before proxying
            rewrite ^{{ .Values.ContextUrl.appcontext }}(/auth/.*)$ $1 break;
            # CRITICAL: Use upstream with connection pooling
            proxy_pass http://console_gateway;
    {{- else }}
        location /auth {
            # CRITICAL: Use upstream with connection pooling
            proxy_pass http://console_gateway;
    {{- end }}
            # This targets ALL cookies (*) and sets the flags.
            proxy_cookie_flags ~ SameSite=None Secure;

            # Ensure the path remains correct
            proxy_cookie_path / /;

            # Standard proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            
            # CRITICAL: HTTP/1.1 with Connection header for keepalive
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            
            # CHANGED: Enable buffering for better performance
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_busy_buffers_size 8k;
            
            proxy_redirect off;
            
            # CRITICAL: Retry on connection failures
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 30s;
            
            # CRITICAL: Add timeouts
            proxy_connect_timeout 30s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: castimaging
    imaging.group: console
    imaging.service: cookie-adapter-service
  name: cookie-adapter-nginx
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.CookieAdapterServiceReplicaCount }}
  selector:
    matchLabels:
      imaging.service: cookie-adapter-service
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: "false"
      labels:
        app: castimaging
        imaging.group: console
        imaging.service: cookie-adapter-service
    spec:
  {{- if .Values.EnforceNodeAffinity }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            {{- toYaml .Values.nodeSelectorAppcastimaging | nindent 12 }}
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            {{- toYaml .Values.labelSelectorServiceSso | nindent 12 }}
          preferredDuringSchedulingIgnoredDuringExecution:
            {{- toYaml .Values.podAffinityGroupConsole | nindent 12 }}
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            {{- toYaml .Values.labelSelectorGroupViewer | nindent 12 }}
  {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: nginx
        image: "{{ .Values.CookieAdapterImage.name }}:{{ .Values.CookieAdapterImage.tag}}"
        imagePullPolicy: "{{ .Values.CookieAdapterImage.pullPolicy }}"
        # Add proper probes
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 2
        
        startupProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 0
          periodSeconds: 2
          timeoutSeconds: 1
          failureThreshold: 30
        ports:
        - containerPort: 8080
        securityContext:
  {{- if .Values.RestrictedSecurityMode }}
          readOnlyRootFilesystem: true
  {{- end }}
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          privileged: false
        resources:
          limits:
            cpu: 200m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 128Mi
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
        volumeMounts:
        - name: config
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
          readOnly: true
  {{- if .Values.RestrictedSecurityMode }}
        - name: tmp
          mountPath: /tmp
        - name: cache
          mountPath: /var/cache
  {{- end }}
      volumes:
      - name: config
        configMap:
          name: cookie-adapter-config
  {{- if .Values.RestrictedSecurityMode }}
      - name: tmp
        emptyDir: {}
      - name: cache
        emptyDir: {}
  {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: castimaging
    imaging.group: console
    imaging.service: cookie-adapter-service
  name: cookie-adapter-service
  namespace: {{ .Release.Namespace }}
spec:
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    imaging.service: cookie-adapter-service
{{- end }}